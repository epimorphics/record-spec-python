namespaces:
  ex: http://example.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
  - record-mapper-core.yaml
embedded:
  - name: Nested.RecordB
    requires:
      "@type": "http://example.org/B"
    properties:
      "@id": "<{@id}>"
      "@type": "<{@type}>"
      "<http://example.org/label>": "{label | smap_to('rdfLangString')}"
resources:
  - name: RecordA
    properties:
      "@id": "<{@id}>"
      "@type": "<{@type}>"
      "<http://example.org/p1>": "{p1 | map_to('Nested.RecordB')}"
