base: http://example.org/spec/literals_model.ttl
prefixes:
  - prefix: ex
    uri: http://example.org/
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#

records:
  RecordA:
    classUri: ex:A
    shortCode: RecordA
    properties:
      p1:
        propertyUri: ex:p1
        shortCode: p1
        kind: literal
        constraints:
          - datatype: rdf:langString
  RecordB:
    extends: RecordA
    classUri: ex:B
    shortCode: RecordB
    properties:
      p2:
        propertyUri: ex:p2
        shortCode: p2
        kind: object
        constraints:
          - record: RecordA
  RecordC:
    extends: RecordB
    classUri: ex:C
    shortCode: RecordC
    properties:
      p2:
        propertyUri: ex:p2
        shortCode: p2
        kind: object
        constraints:
          - record: RecordB
