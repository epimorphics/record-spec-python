namespaces:
  ex: http://example.org/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
  - record-mapper-core.yaml
embedded:
  - name: Nested.Parent
    requires:
      "@type": "http://example.org/Parent"
    properties:
      "@id": "<{@id}>"
      "@type": "<{@type}>"
  - name: Nested.Child
    requires:
      "@type": "http://example.org/Child"
    properties:
      "@id": "<{@id}>"
      "@type": "<{@type}>"
resources:
  - name: Inheritance
    properties:
      "@id": "<{@id}>"
      "@type": "<{@type}>"
      "<http://example.org/p1>":
        - "{p1 | map_to('Nested.Parent')}"
        - "{p1 | map_to('Nested.Child')}"
