base: http://example.org/spec/references_model.ttl
prefixes:
  - prefix: ex
    uri: http://example.org/
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#

records:
  RecordA:
    classUri: ex:A
    shortCode: RecordA
    properties:
      p1:
        propertyUri: ex:p1
        shortCode: p1
        kind: object
        constraints:
          - record: recordB
      p2:
        propertyUri: ex:p2
        shortCode: p2
        kind: object
        repeatable: true
        constraints:
          - record: recordB
      p3:
        propertyUri: ex:p3
        shortCode: p3
        kind: object
        constraints:
          - record: recordB
          - record: recordC

  RecordB:
    classUri: ex:B
    shortCode: RecordB
    properties:
      p4:
        propertyUri: ex:p1
        shortCode: p4
        kind: object
        reversed: true
        constraints:
          - record: recordA
      p5:
        propertyUri: ex:p5
        shortCode: p5
        kind: object
        repeatable: true
        constraints:
          - record: recordC

  RecordC:
    classUri: ex:C
    shortCode: RecordC
