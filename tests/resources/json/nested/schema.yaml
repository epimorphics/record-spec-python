base: http://example.org/spec/simple
prefixes:
  - prefix: def
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#

records:
  Foo:
    classUri: def:Foo
    shortCode: Foo
    properties:
      nestedBar:
        kind: object
        propertyUri: def:nestedBar
        nested: true
        constraints:
          - record: Bar
  Bar:
    classUri: def:Bar
    shortCode: Bar
    properties:
      nestedBaz:
        kind: object
        propertyUri: def:nestedBaz
        nested: true
        constraints:
          - record: Baz
  Baz:
    classUri: def:Baz
    shortCode: Baz
    properties:
      label:
        propertyUri: def:label
        kind: literal
        constraints:
          - datatype: xsd:string
      hasFoo:
        propertyUri: def:hasFoo
        kind: object
        constraints:
          - record: Foo
