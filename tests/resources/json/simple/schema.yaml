base: http://example.org/spec/simple
prefixes:
  - prefix: def
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#

records:
  Foo:
    classUri: def:Foo
    shortCode: Foo
    properties:
      optionalStringProp:
        propertyUri: def:optionalStringProp
        kind: literal
        constraints:
          - datatype: xsd:string
  Bar:
    classUri: def:Bar
    shortCode: Bar
    properties:
      requiredFooRef:
        propertyUri: def:requiredFooRef
        kind: object
        required: true
        constraints:
          - record: Foo
