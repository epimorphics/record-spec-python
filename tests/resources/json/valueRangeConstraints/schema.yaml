base: http://example.org/spec/simple
prefixes:
  - prefix: def
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#
records:
  Foo:
    classUri: def:Foo
    shortCode: Foo
    properties:
      minMaxInt:
        propertyUri: def:minMaxInt
        kind: literal
        constraints:
          - datatype: xsd:integer
            minInclusive: "0"
            maxInclusive: "100"
      minMaxDouble:
        propertyUri: def:minMaxDouble
        kind: literal
        constraints:
          - datatype: xsd:double
            minExclusive: "0"
            maxExclusive: "100"
