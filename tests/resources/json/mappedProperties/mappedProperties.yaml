base: http://example.org/spec/simple
prefixes:
  - prefix: def
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#

records:
  Foo:
    classUri: def:Foo
    shortCode: Foo
    properties:
      barMap:
        propertyUri: def:barMap
        kind: object
        nested: true
        map:
          keyProperty: notation
        constraints:
          - record: Bar
  Bar:
    classUri: def:Bar
    shortCode: Bar
    properties:
      notation:
        propertyUri: def:notation
        kind: literal
        required: true
        constraints:
          - datatype: xsd:string
      label:
        propertyUri: def:label
        kind: literal
        constraints:
          - datatype: xsd:string
