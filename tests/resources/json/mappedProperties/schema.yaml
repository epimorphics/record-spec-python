base: http://example.org/spec/
prefixes:
  - prefix: def
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#

records:
  Foo:
    classUri: def:Foo
    shortCode: Foo
    properties:
      barNotationMap:
        propertyUri: def:barNotationMap
        kind: object
        nested: true
        repeatable: true
        map:
          keyProperty: notation
        constraints:
          - record: Bar
      barIdMap:
        propertyUri: def:barIdMap
        kind: object
        nested: true
        repeatable: true
        map:
          keyProperty: "@id"
        constraints:
          - record: Bar
  Bar:
    classUri: def:Bar
    shortCode: Bar
    properties:
      notation:
        propertyUri: def:notation
        kind: literal
        required: true
        constraints:
          - datatype: xsd:string
      label:
        propertyUri: def:label
        kind: literal
        repeatable: true
        constraints:
          - datatype: xsd:string
