base: http://example.org/spec/simple
prefixes:
  - prefix: def
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdf
    uri: http://www.w3.org/1999/02/22-rdf-syntax-ns#
records:
  Foo:
    classUri: def:Foo
    shortCode: Foo
    properties:
      unmappedDatatype:
        propertyUri: def:unmappedDatatype
        kind: literal
        constraints:
          - datatype: def:myDatatype
      multipleUnmappedDatatypes:
        propertyUri: def:multipleUnmappedDatatypes
        kind: literal
        constraints:
          - datatype: def:myDatatype
          - datatype: def:myOtherDatatype
      unmappedDatatypeWithPattern:
        propertyUri: def:unmappedDatatypeWithPattern
        kind: literal
        constraints:
          - datatype: def:myDatatype
            pattern: "foo|bar"
