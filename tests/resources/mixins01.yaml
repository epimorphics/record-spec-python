base: http://test.epimorphics.com/record-spec/mixins01.yaml
prefixes:
  - prefix: d
    uri: http://test.epimorphics.com/record-spec/def/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdfs
    uri: http://www.w3.org/2000/01/rdf-schema#
mixins:
  MixinA:
    properties:
      a:
        propertyUri: d:a
        kind: literal
        constraints:
          - datatype: xsd:string
  MixinB:
    properties:
      b:
        propertyUri: d:b
        kind: literal
        required: true
        repeatable: true
        constraints:
          - datatype: xsd:integer
  MixinC:
    properties:
      c:
        propertyUri: d:c
        kind: object
        required: true
        repeatable: false
        constraints:
          - record: RecordC
records:
  RecordA:
    classUri: d:A
    shortCode: RecordA
    mixins:
      - MixinA
  RecordB:
    classUri: d:B
    extends: RecordA
    shortCode: RecordB
    mixins:
      - MixinB
  RecordC:
    classUri: d:C
    extends: RecordB
    shortCode: RecordC
    mixins:
      - MixinC
  RecordD:
    classUri: d:D
    shortCode: RecordD
    mixins:
      - MixinA
      - MixinB
      - MixinC
  RecordE:
    classUri: d:E
    extends: RecordC
    shortCode: RecordE
    # It is OK to redeclare inherited mixins
    mixins:
      - MixinA
      - MixinB
      - MixinC
