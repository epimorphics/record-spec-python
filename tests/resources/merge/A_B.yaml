base: "http://example.org/spec/"
prefixes:
  - prefix: ex
    uri: "http://example.org/def/"
  - prefix: xsd
    uri: "http://www.w3.org/2001/XMLSchema#"
mixins:
  MixinA:
    properties:
      label:
        kind: literal
        propertyUri: ex:label
        required: false
        repeatable: false
        constraints:
          - datatype: xsd:string

records:
  RecordA:
    shortCode: A
    classUri: ex:RecordA
    mixins:
      - MixinA
    properties:
      foo:
        kind: literal
        propertyUri: ex:foo
        required: false
        repeatable: true
        constraints:
          - datatype: xsd:string
  RecordB:
    shortCode: B
    classUri: ex:RecordB
    mixins:
      - MixinA
    properties:
      name:
        kind: literal
        propertyUri: ex:name
        required: true
        repeatable: false
        constraints:
          - datatype: xsd:string
