base: http://test.epimorphics.com/record-spec/inheritance01.yaml
prefixes:
  - prefix: d
    uri: http://test.epimorphics.com/record-spec/def/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
  - prefix: rdfs
    uri: http://www.w3.org/2000/01/rdf-schema#
records:
  Base:
    classUri: d:Base
    shortCode: Base
    properties:
      label:
        propertyUri: rdfs:label
        kind: literal
        constraints:
          - datatype: xsd:string
        required: true
        repeatable: true
      age:
        propertyUri: d:age
        kind: literal
        constraints:
          - datatype: xsd:integer
        required: false
        repeatable: false
      replaces:
        propertyUri: d:replaces
        kind: object
        constraints:
          - record: Base
        required: false
        repeatable: false
  DerivedA:
    extends: Base
    classUri: d:DerivedA
    shortCode: DerivedA
    properties:
      age:
        propertyUri: d:age
        kind: literal
        required: true
        constraints:
          - datatype: xsd:integer
            minInclusive: 0
            maxInclusive: 100
      replaces:
        propertyUri: d:replaces
        kind: object
        constraints:
          - record: DerivedA
  DerivedB:
    extends: DerivedA
    classUri: d:DerivedB
    shortCode: DerivedB
    properties:
      replaces:
        propertyUri: d:replaces
        kind: object
        constraints:
          - record: DerivedB
