base: http://example.org/spec/mixins.ttl
prefixes:
  - prefix: ex
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
records:
  spec:Foo:
    classUri: ex:Foo
    shortCode: Foo
    mixins:
      - spec:MixinA
  spec:Bar:
    classUri: ex:Bar
    shortCode: Bar
    mixins:
      - spec:MixinA
      - spec:MixinB
mixins:
  spec:MixinA:
    properties:
      label:
        kind: literal
        propertyUri: ex:label
        required: false
        repeatable: true
        constraints:
          - datatype: xsd:string
      isFooOf:
        kind: object
        propertyUri: ex:hasFoo
        required: false
        repeatable: true
        nested: false
        reversed: true
  spec:MixinB:
    properties:
      hasFoo:
        kind: object
        propertyUri: ex:hasFoo
        required: true
        repeatable: false
        nested: false
        reversed: false
        constraints:
          - record: spec:Foo
