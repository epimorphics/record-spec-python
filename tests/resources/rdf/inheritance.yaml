base: http://example.org/spec/inheritance.ttl
prefixes:
  - prefix: ex
    uri: http://example.org/def/
  - prefix: spec
    uri: http://example.org/spec/
  - prefix: xsd
    uri: http://www.w3.org/2001/XMLSchema#
records:
  spec:Foo:
    classUri: ex:Foo
    extends: spec:Base
    shortCode: Foo
  spec:Base:
    classUri: ex:Base
    shortCode: Base
  spec:Bar:
    classUri: ex:Bar
    extends: spec:Foo
    shortCode: Bar
